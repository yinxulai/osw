# 匿名使用统计的上报端点。
#
# 部署：`pnpm --filter @osw/api deploy`（云端由 Workers Builds 关联仓库自动跑，本地手动部署
# 就这一条命令）。**没有密钥要配**——存储是同一个账号里的一个 Analytics Engine 数据集，
# 它靠下面那段绑定拿到，不经 `wrangler secret put`。
#
# Workers Builds 三条命令（Root directory = `apps/apis`）：
#   Build   `pnpm run build` → `deploy:dry-run`。Worker 没有单独的编译阶段，「打包」就是构建，
#           所以这一步与部署跑的是同一件事，区别只是不推上去。它必须存在：把 Build command
#           填成 `pnpm run build` 而包里没有这个 script，构建会以 ERR_PNPM_NO_SCRIPT 直接失败。
#   Deploy  `npx wrangler deploy`
#   Version `npx wrangler versions upload`

name = "osw-apis"
main = "source/index.ts"

# 固定兼容日期，不跟最新：Worker 的运行期行为以它为界，改它等于悄悄换一次运行时语义。
# 升级应当是一次单独的、能被回滚的提交，而不是顺手搭在别的改动上。
compatibility_date = "2026-01-01"

# 绑定自有域名。缘由与前提见下面「自定义域名」一节。
#
# ⚠️ 这一段必须在**任何 `[表头]` 之前**：TOML 里 `[observability]` 之后的键都属于那张表，
# 放错位置只会得到一句「Unexpected fields found in observability field」的告警，
# **而部署照常进行**——正是那种静默失效。
routes = [
  { pattern = "api.osw.yinxulai.com", custom_domain = true },
]

[observability]
# 打开 Worker 的日志与指标。日志里**没有**安装标识、没有来源地址、没有报文正文——
# 这一段只回答「端点活着吗、下游答不答」，不回答「谁在发」。
#
# 每一个非 2xx 出口都会留一行，形状统一（`source/log.ts`）：
#
#   [apis] status=500 error=not_configured missing=TELEMETRY
#
# 2xx 不打：成功行会按「安装数 × 频率」增长，而它回答不了任何问题。
# 要查历史日志：Cloudflare 后台 → Workers & Pages → osw-apis → Logs；
# 要看实时的：在 `apps/apis` 里跑 `pnpm exec wrangler tail`。
enabled = true

# ---------------------------------------------------------------- 存储

[[analytics_engine_datasets]]
# 写入数据集。它有两个名字，各自只有一个读者：
#
#   binding  = "TELEMETRY"      代码里的 `env.TELEMETRY`，**改它就要改 `source/index.ts`**；
#   dataset  = "osw_telemetry"  存储侧的表名，**改它就要改读侧的 SQL**（也改
#                               `source/sinks/analytics-engine.ts` 里的 `ANALYTICS_ENGINE_DATASET`）。
#
# 用下划线不用连字符：它在 SQL 里是个标识符（`FROM osw_telemetry`）。
#
# **数据集不用在后台建**——第一次写入时自动创建。所以这一段的生效条件很简单：把它写完、部署。
#
# ⚠️ 与上一版（`APTABASE_APP_KEY`）最大的区别：这里**没有秘密**。没有密钥、没有区域地址、
# 没有第三方账号，因此也就没有「部署时忘了 `wrangler secret put`」这类事故，以及它带来的
# 那一档 500。仍然会有一档 500，但它现在只意味着「这一段没写、或写到了别的 Worker」：
#
#   [apis] status=500 error=not_configured missing=TELEMETRY
#
# 它的价值没有变：数据宁可明确丢掉一个请求，也不静默丢一整天。
binding = "TELEMETRY"
dataset = "osw_telemetry"

# ---------------------------------------------------------------- 自定义域名
#
# **上线前必须做这一步。** 客户端里写死的地址是自有域名，`workers.dev` 子域绑在平台命名空间上、
# 改名即作废，不能让已发布的客户端依赖它。
#
# 这里直接声明绑定，而不是只留一句「去后台手点一下」：`wrangler deploy` 会顺带创建 DNS 记录并
# 申请证书，于是「域名绑过了没有」变成仓库里可复核的一行，而且和 `TELEMETRY_ENDPOINT` 并排
# 看得见——两者不一致时事件会打到默认的 `workers.dev` 域上，能跑通，但「发布出去的地址就是
# 永久地址」这条就废了。
#
# 前提：`yinxulai.com` 这个 zone 在**同一个 Cloudflare 账号**下。不满足时 deploy 会直接报错
# （找不到 zone），那时只有两条路：把 zone 挪到本账号，或删掉上面那段 `routes`、改为在后台
# Workers → 本 Worker → Settings → Domains & Routes → Add custom domain 手动绑。

# 域名配好之后，在它的 Rate limiting rules 里加一条针对 `POST /v1/track` 的规则：
# **这是这条链路上唯一的限流手段。** Worker 里刻意不做：那里的计数器住在单个 isolate 的内存里，
# 而 Cloudflare 会同时跑很多个 isolate、很多个机房，状态既不共享也不持久，实际放行量是
# 「配置值 × 机房数」的量级。按客户端聚合只有边缘做得到，所以这条规则不是「补充」，是必需的
# （理由与取舍写全在 `source/index.ts` 的文件头「关于限流」）。

# ---------------------------------------------------------------- 路由
#
# **只有一条**，写在 `source/index.ts` 里，这里只是让部署的人知道域名上有哪些地址在服务：
#
#   POST /v1/track  客户端契约，路径永久。限流规则盯的是它。
#
# 其余路径一律 404（`/` 也是），所以域名上不会出现「不知道为什么有回应」的地址。
#
# 刻意**没有**健康检查接口：域名上「只有一条路径」本身就是最强的信号，而部署后要确认的只有
# 「路由注册上了没有」——`GET /v1/track` 的 405 就回答了它。

# ---------------------------------------------------------------- 地理位置
#
# 地区那一格靠 `CF-IPCountry`：Cloudflare 在边缘按真实客户端 IP 判好的一枚两字母代码，由它加在
# 进入 Worker 的请求上（见 `source/index.ts` 的 `countryOf`）。它是**默认开启**的，不需要在这里配；
# 写在这里是因为它是这份部署里唯一一处「平台替我们算好的东西」：拿不到就当不知道，
# 地区那一格会是空的，而不是错的。
#
# 客户端的地址在这条链路上**连读都没有被读过**：Worker 里没有任何一行代码碰它，更谈不上转发
# （限流已经移到域名上，见上文）。唯一跟地址有关的东西是上面那枚由边缘算好的国家代码。

# ---------------------------------------------------------------- 密钥
#
# **这一版没有密钥，一个都没有。** 上一版这里是一段 `wrangler secret put APTABASE_APP_KEY`，
# 及相关的一大堆注意事项（后台必须选 Secret 而不是 Variable、区域要与入口地址对得上、
# 漏配了会在线上回 500……）。换成 Analytics Engine 之后整段消失了：数据落在本账号的一个数据集
# 里，写入靠上面那段**绑定**，而绑定不是秘密——它不能被拿去别处用，也不会因为泄露而被人灌数据。
#
# 这一节留着，是为了让下一个找密钥的人看到「不是忘了写，是这里确实一件都没有」。下一次如果要接
# 一个有密钥的后端，要记住的事仍然成立（它在 git 历史里）：这份文件是配置的唯一真相，**密钥走
# `wrangler secret put`、不进仓库**；而后台手填的变量与配置里的 `[vars]` 是同一处东西，下一次
# deploy 会以后者为准（不想被覆盖得显式开 `keep_vars`），Secret 则不在这个覆盖范围内。
