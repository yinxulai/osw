packages:
  - packages/*
  - apps/*
  # docs 的内容根是开放文档（`apps/docs/source/`，按语言分 `zh/`、`en/` 两个子目录），内部规格、上游快照与设计资产
  # 在同级的 `specs/`、`upstream/`、`assets/` 下，不参与站点构建。
  - apps/docs

allowBuilds:
  electron: true
  esbuild: true
  # wrangler 的本地运行时。只在 `wrangler dev` / `deploy --dry-run` 时用到，
  # 但装不上它时 wrangler 的报错很绕（指向 approve-builds），不如直接放行。
  workerd: true
