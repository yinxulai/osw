<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OSW — X cover (1600×900)</title>
<!--
  参考根目录 image.png（magpie 那条 X 帖图）为 OSW 复刻的封面。

  交付方式：手动截图。浏览器打开本文件 → DevTools → 「Capture full size screenshot」。
  画布固定 1600×900（X 时间线按 ~500px 宽显示，所以整张图按「缩到 1/3 还能读」设计）。

  两个必须留意的点：
  1. @font-face 的路径是相对本文件的。本文件在 docs/design/x-post/ 下，离仓库根 3 层，
     所以是 ../../../node_modules/... —— 移动文件后必须同步改，写错的后果是
     静默回退到 Segoe UI（渲染出来「很粗糙」，但控制台不报错到脸上）。
     仓库只装了 @fontsource-variable/geist，没有 geist-mono，别给 mono 另写 @font-face。
  2. 右侧是产品真实截图 snapshot/en/01-logical-models.png，按 1.4 倍放大后出血裁切，
     只留 border-top + border-left。截图本身要在仓库里，换机器/换目录会裂。
-->
<style>
  @font-face {
    font-family: 'Geist Variable';
    src: url('../../../node_modules/.pnpm/@fontsource-variable+geist@5.3.0/node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2') format('woff2-variations');
    font-weight: 100 900;
    font-style: normal;
    font-display: block;
  }

  :root {
    /* 画布底色取官网的 --color-void，比应用界面（#121212）再暗一档，
       这样右侧截图面板靠「明度阶梯」就能浮起来，不用阴影。 */
    --void: #06070a;
    /* 下面这组直接抄 packages/console/source/index.css 的暗色主题。 */
    --ink-1: #fbfbfc;
    --ink-2: #d9d9de;
    --ink-3: rgb(200 206 218 / 0.62);
    --ink-4: rgb(200 206 218 / 0.45);
    --module-border: rgb(200 206 218 / 0.16);
    --chip-border: rgb(200 206 218 / 0.14);
    --chip-bg: #141417;
    --font-sans: 'Geist Variable', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-mono: ui-monospace, 'SF Mono', 'Geist Mono', 'Source Code Pro', Menlo, Monaco, monospace;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; background: var(--void); }

  body {
    font-family: var(--font-sans);
    color: var(--ink-1);
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }

  .stage {
    position: relative;
    width: 1600px;
    height: 900px;
    overflow: hidden;
    background: var(--void);
  }

  /* ---------- 左栏：品牌 + 主张 ----------
     参考图的左栏是「上重下空」的反向节奏：标志孤零零吊在顶部，
     主张整块压到下半屏。所以这里用 flex + auto margin 把内容块从底部顶起来，
     字号量级（标题 100 / 副标题 28 / 图标格 56）都按参考图折算过。 */

  .brand {
    position: absolute;
    left: 84px;
    top: 0;
    bottom: 0;
    width: 660px;
    padding: 104px 0 94px;
    display: flex;
    flex-direction: column;
  }

  .brand__top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    height: 46px;
  }

  .mark { display: flex; align-items: center; gap: 14px; }
  .mark svg { display: block; width: 40px; height: 40px; }
  .mark b { font-size: 46px; font-weight: 640; letter-spacing: -0.01em; color: var(--ink-1); }

  .site {
    margin-top: 8px;
    font-family: var(--font-mono);
    font-size: 24px;
    letter-spacing: 0.01em;
    color: rgb(200 206 218 / 0.55);
  }

  h1 {
    margin: auto 0 0;
    font-size: 100px;
    line-height: 0.94;
    font-weight: 640;
    letter-spacing: -0.035em;
    color: var(--ink-1);
    white-space: nowrap;
  }

  /* 第二行压暗：「同一句话的后半截」，与参考图一致。 */
  h1 .dim { color: rgb(200 206 218 / 0.5); }

  /* 副标题紧贴在主张下方：参考图里两者基线只隔 71px（不到一行标题）。 */
  .sub {
    margin: 30px 0 0;
    font-size: 28px;
    line-height: 1.35;
    letter-spacing: -0.014em;
    color: var(--ink-3);
  }

  /* 供应商图标钉在左下角。图标图形只占 120 画布的 65 内框（≈54%），
     所以要放到 68 才让墨迹占到格子的 2/3 —— 和参考图里那排「应用图标」一个密度。
     溢出的部分由格子自己裁掉（比如 anthropic 那张本来就是满幅底色）。
     10 × 56 + 9 × 10 = 650，刚好收在 660 的栏宽里。 */
  .providers {
    margin-top: 31px;
    display: flex;
    gap: 10px;
  }

  .providers span {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 56px;
    height: 56px;
    overflow: hidden;
    border: 1px solid var(--chip-border);
    border-radius: 14px;
    background: var(--chip-bg);
  }

  .providers img { display: block; width: 68px; height: 68px; flex: none; }

  /* ---------- 右栏：应用截图，左+上出血 ---------- */

  /* 可见源区：snapshot/en/01-logical-models.png 的 x ∈ [0, 570]、y ∈ [12, 592]。
     1139 × 696 的源图 × 1.4 = 1595 × 974。
     横向切开的位置（源图 x=570）落在「Standby 徽章右缘 558」和「卡片右框 586」之间；
     纵向（源图 y=592）落在第 5 行与第 6 行的行间发丝线下方 —— 两刀都不切字。
     容器 802..1614 × 88..940，右边和底下都落在画布外，天然裁掉。 */
  .shot {
    position: absolute;
    left: 802px;
    top: 88px;
    width: 812px;
    height: 852px;
    overflow: hidden;
    background: #0f0f10;
    border-top: 1px solid var(--module-border);
    border-left: 1px solid var(--module-border);
    border-radius: 18px 0 0 0;
  }

  .shot img {
    position: absolute;
    left: 0;
    top: -17px;
    width: 1595px;
    height: auto;
    display: block;
  }
</style>
</head>
<body>
<div class="stage">

  <div class="brand">
    <div class="brand__top">
      <div class="mark">
        <!-- 标志几何与 packages/console/public/icon.svg 同源。
             这里不带那层 0.6136 的缩放系数 —— 那个系数是为了跟供应商图标对齐内框留白，
             品牌锁定（标志 + 字标）不需要，用原始几何才对得上字标的高度。 -->
        <svg viewBox="0 0 256 256" aria-hidden="true">
          <defs>
            <linearGradient id="osw-mark" gradientUnits="userSpaceOnUse" x1="41" y1="16" x2="215" y2="241">
              <stop offset="0" stop-color="#FFE066" />
              <stop offset="0.38" stop-color="#FF9500" />
              <stop offset="0.72" stop-color="#F0297C" />
              <stop offset="1" stop-color="#7C3AED" />
            </linearGradient>
          </defs>
          <path
            d="M186 33L58 148H114L84 224L198 108H142Z"
            fill="url(#osw-mark)"
            stroke="url(#osw-mark)"
            stroke-width="34"
            stroke-linejoin="round"
          />
        </svg>
        <b>OSW</b>
      </div>
      <div class="site">osw.yinxulai.com</div>
    </div>

    <h1>Every model.<br /><span class="dim">One address.</span></h1>
    <p class="sub">Automatic failover across all your providers.</p>

    <div class="providers">
      <span><img src="../../../packages/console/source/catalog/providers/openai/icon.dark.svg" alt="" /></span>
      <span><img src="../../../packages/console/source/catalog/providers/anthropic/icon.dark.svg" alt="" /></span>
      <span><img src="../../../packages/console/source/catalog/providers/google/icon.dark.svg" alt="" /></span>
      <span><img src="../../../packages/console/source/catalog/providers/xai/icon.dark.svg" alt="" /></span>
      <span><img src="../../../packages/console/source/catalog/providers/deepseek/icon.dark.svg" alt="" /></span>
      <span><img src="../../../packages/console/source/catalog/providers/moonshot/icon.dark.svg" alt="" /></span>
      <span><img src="../../../packages/console/source/catalog/providers/zhipu/icon.dark.svg" alt="" /></span>
      <span><img src="../../../packages/console/source/catalog/providers/minimax/icon.dark.svg" alt="" /></span>
      <span><img src="../../../packages/console/source/catalog/providers/qiniu/icon.dark.svg" alt="" /></span>
      <span><img src="../../../packages/console/source/catalog/providers/volcengine/icon.dark.svg" alt="" /></span>
    </div>
  </div>

  <div class="shot">
    <img src="../../../snapshot/en/01-logical-models.png" alt="OSW logical models view" />
  </div>

</div>
</body>
</html>
