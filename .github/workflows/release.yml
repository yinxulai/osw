name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example, 0.1.0 or v0.1.0)
        required: true
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - name: Check out release branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          # 这一节跑的是裸 lint / typecheck / vitest，不经过 turbo。
          turbo-cache: 'false'
          tool-cache: 'true'

      - name: Validate version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: $INPUT_VERSION"
            exit 1
          fi
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists; this workflow will update the existing release instead of failing."
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # 版本号只写在仓库根的 manifest 里：脚本从 `pnpm-workspace.yaml` 现算 workspace 包目录，
      # 把根版本强制覆盖到每一份 manifest（加包不用改这里，也不用改下面的 `git add`）。
      - name: Update package versions
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node packages/toolkit/scripts/version.mjs "$VERSION"

      - name: Run release checks
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Commit version
        id: commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 这两对 glob 必须和 `version.mjs` 覆盖的是同一批包（`pnpm-workspace.yaml` 的
          # `packages/*` 与 `apps/*`）。这里曾把后者写死成 `apps/app`，于是 `apps/cli` 一路没被提交：
          # `1.1.0-beta.3` 发出去之后，仓库里它还是 `1.1.0-beta.2`——产物是对的、本地全绿，看不出来。
          # `pnpm lint` 里的 `version.mjs --check` 是兜底：漏提交一份，CI 就红。
          git add package.json pnpm-lock.yaml apps/*/package.json packages/*/package.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): $VERSION"
            git push origin HEAD:${{ github.ref_name }}
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            artifact: macos
            asset: |
              release/**/*.dmg
              release/**/*.zip
          - name: Windows
            os: windows-latest
            artifact: windows
            asset: release/**/OSW-*.exe
          - name: Linux
            os: ubuntu-latest
            artifact: linux
            asset: release/**/OSW-*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Set up environment
        uses: ./.github/actions/setup

      # `pnpm release:*` = `turbo run build` + electron-builder。
      # 矩阵里的三个系统各存各的 Turbo 缓存（key 里带 runner.os），不会互相覆盖。
      - name: Build installer
        run: ${{ runner.os == 'macOS' && 'pnpm release:mac' || runner.os == 'Windows' && 'pnpm release:win' || 'pnpm release:linux' }}

      - name: Create installer checksums
        shell: bash
        run: |
          # 每个安装包都配一份 `.sha256`：发布说明的下载表把校验链接放在文件名旁边，
          # 只给 macOS 的 dmg 算，表里其余几行就只能写「—」，看起来像漏了。
          # GNU 的 `sha256sum` 与 Perl 的 `shasum` 参数不同：`-a 256` 只有 `shasum` 认，
          # `sha256sum` 会直接报 `unknown option -- a`（Windows 的 bash 来自 Git for Windows，
          # 它只提供 `sha256sum`，这一条曾经让整个 Windows 构建挂在最后一步）。
          # 两者的输出格式一致（`<hash>  <name>`），所以按可用性挑一个再统一调用。
          hash256() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1"
            else
              shasum -a 256 "$1"
            fi
          }
          # `release/` 下不只有安装包：`<version>/win-unpacked/` 里还放着 electron-builder
          # 自己的可执行文件（`OSW.exe`、`elevate.exe`）。宽泛的 `-name '*.exe'` 会把它们
          # 一起算进来，而这些文件不匹配上面 `matrix.asset` 的上传 glob，结果 release 里会多出
          # 两个「点进去是 404」的 `.sha256`（2026-09 的 beta.2 就发了 `OSW.exe.sha256`
          # 和 `elevate.exe.sha256`）。安装包一律是 `OSW-<版本>-<平台>-<架构>.exe`
          # （见 `electron-builder.config.cjs` 的 `artifactName`），所以 exe 用带前缀的模式限定，
          # `.dmg` / `.AppImage` 不会出现在 unpacked 目录里，保持原样即可。
          while IFS= read -r INSTALLER; do
            DIR=$(dirname "$INSTALLER")
            NAME=$(basename "$INSTALLER")
            (cd "$DIR" && hash256 "$NAME" > "$NAME.sha256")
          done < <(find release -type f \( -name '*.dmg' -o -name 'OSW-*.exe' -o -name '*.AppImage' \))

      - name: Collect installer and update metadata
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          # 发布产物包含：
          # - 安装包（.dmg/.zip/.exe/.AppImage）
          # - .blockmap：electron-updater 差量更新所需
          # - latest*.yml：electron-updater 版本检查元数据
          #   （latest.yml / latest-mac.yml / latest-linux.yml）
          path: |
            ${{ matrix.asset }}
            release/**/*.blockmap
            release/**/latest*.yml
            release/**/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check out release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          # 发布说明要按「离 HEAD 最近的发布标签」划变更范围，标签必须都在本地。
          fetch-tags: true

      - name: Create release tag
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "$TAG" -m "Release $TAG"
          git push --force origin "$TAG"

      - name: Download installers
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      # 发布说明由提交记录生成：按提交类型分组、从中读出破坏性变更、再用真实产物拼下载表。
      # 脚本只用 node 内建模块，不需要依赖安装，所以这里不引入 setup 步骤。
      - name: Generate release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          node apps/app/scripts/release-notes.mjs \
            --version "$VERSION" \
            --tag "$TAG" \
            --assets-dir artifacts \
            --output "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: OSW ${{ needs.prepare.outputs.tag }}
          body_path: ${{ runner.temp }}/release-notes.md
          # 不开 `generate_release_notes`：它附带的那行 Full Changelog 与生成脚本自己写的
          # 重复，两行怎么合并由 action 决定，不如自己只留一行。
          prerelease: ${{ inputs.prerelease }}
          fail_on_unmatched_files: true
          overwrite_files: true
          files: artifacts/**/*

  # CLI 上 npm 与桌面安装包是同一个版本号，所以它必须跟着这一版走，而不是被标签「顺带撞见」。
  # 以前它是独立的 `.github/workflows/publish-cli.yml`、靠 `push: tags: v*` 触发，而标签是
  # 本文件用 `GITHUB_TOKEN` 推的——GitHub 规定：用 `GITHUB_TOKEN` 造成的 push **不会**再触发
  # 其他 workflow。于是那条通道一次都没跑过（`v1.3.2` 发布后 npm 上仍然停在 `1.3.1`，
  # `gh run list --workflow=publish-cli.yml` 是空的）。写进同一个 workflow 就没有这个断层。
  #
  # 两个仍然成立的约束：
  # ① 权限必须独立写在 job 上。发 npm 只要 `id-token: write`（换 OIDC token，provenance
  #    由 npm 自动签发，不需要 `--provenance`）与 `contents: read`，而 workflow 级是
  #    `contents: write`（要打 tag）。job 级 permissions 会整体覆盖 workflow 级，正好隔离。
  # ② npm 的 Trusted Publisher 绑定的是 **workflow 文件名**，所以 npmjs.com 上的配置必须
  #    指向 `release.yml`。已有的 `publish-cli.yml` 那条连接改不了，只能删掉重建；
  #    新建的配置要在两天内成功发布一次，否则失效（见 packaging.md §5.8）。
  publish-cli:
    name: Publish CLI to npm
    # 排在 `publish` 之后：先有 GitHub Release（可追踪的那一版），再往 npm 上架。
    # 反过来会让 npm 上出现一个「说不清是谁」的版本。
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      # 不复用 `.github/actions/setup`：那个 composite 没有 `registry-url`，而 Trusted
      # Publisher 的认证读写在那份 `.npmrc` 上；它还会开 pnpm 缓存，而 release 构建不该
      # 用缓存（`package-manager-cache: false` 是 npm 官方对发布流程的要求）。
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          # Trusted Publisher 要求 npm >= 11.5.1；Node 22 自带的是 npm 10，下一步会升级。
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Upgrade npm
        run: npm install --global npm@^11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # lint / typecheck / test 已经在 `prepare` 里对同一份树跑过，这里只补它没做的
      # 那一步：CLI 产物。`build:cli` 只构建 console 与 cli 两个包，不跑整个 turbo 图。
      - name: Build CLI
        run: pnpm build:cli

      - name: Read package metadata
        id: meta
        run: |
          node -e "
            const manifest = require('./apps/cli/package.json')
            console.log('name=' + manifest.name)
            console.log('version=' + manifest.version)
          " >> "$GITHUB_OUTPUT"

      - name: Check registry
        id: registry
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: |
          # 已经在 npm 上的版本不再重复发布：重跑一次 release（比如某个构建重试）不会 409。
          if npm view "${{ steps.meta.outputs.name }}@${{ steps.meta.outputs.version }}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "${{ steps.meta.outputs.name }}@${{ steps.meta.outputs.version }} is already on npm, skipping"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.registry.outputs.published == 'false'
        working-directory: apps/cli
        env:
          # 仓库根的 `.npmrc` 指向 npmmirror 镜像（只读，不能发布）。环境变量优先级高于
          # 任何 `.npmrc`（包括 setup-node 写的那份 userconfig 与仓库里的 project .npmrc），
          # 这是唯一可靠的覆盖方式。
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # 预发布版不能占 `latest`：`npx @one-switch/cli` 装到一个 beta 是事故。
          # 正式版用默认的 `latest`。
          case "$VERSION" in
            *-*) TAG=next ;;
            *)   TAG=latest ;;
          esac
          # `prepack`（apps/cli/scripts/prepack.mjs）会把迁移基线搬进包内的
          # `packages/core/drizzle`，这一步由 npm 自动触发。
          npm publish --access public --tag "$TAG"
