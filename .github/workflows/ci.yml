name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # `pnpm typecheck` 直接跑 tsc（一次覆盖四棵源码树），不经过 turbo，
      # 所以 `.turbo` 缓存永远 miss；tool-cache 换来的则是 tsc 增量信息。
      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          turbo-cache: 'false'
          tool-cache: 'true'

      - name: Run typecheck
        run: pnpm typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # 同 typecheck：ESLint 从仓库根一次跑完，不经过 turbo。
      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          turbo-cache: 'false'
          tool-cache: 'true'

      - name: Run lint
        run: pnpm lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # vitest 同样不由 turbo 驱动，也没有值得留到下轮的产物。
      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          turbo-cache: 'false'

      # 只跑一次：`test:coverage` 本身就是「跑全部测试 + 收集覆盖率」，
      # 再单独跑一遍 `test:server` 等于把 1100 个用例执行两遍。
      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: server-coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 7

  # 这里**有** build job，而且它是刻意的。
  #
  # 曾经删过一版，理由是「每次 push 把渲染层与宿主整个打一遍，换来的只是一份没人下载的
  # artifact」——那是把两件事混成了一件：
  #   - 这个 job 回答的是「这次的改动还能不能构建」；
  #   - `release.yml` 回答的是「发布产物对不对」（三个平台真实打包，那才是产物定义）。
  # 前者只有每次 push 都跑才有意义，后者只在发版时跑。产物路径、`entryFileNames`、
  # `index.html` 里的模块引用这类错误，typecheck / lint / test 一路全绿也照样漏过去，
  # 历史上真出过；只有真的跑一次 `pnpm build` 才看得见。
  # Worker 那侧仍由 Cloudflare Workers Builds 里的 build 命令覆盖（与线上部署同参数）。
  #
  # `needs: [typecheck, test]` 只是省算力：前两个红了就没必要再打一遍。
  # 上传的产物也顺便让「不发版就能下载一份构建产物」成立；要可运行的安装包走
  # `.github/workflows/test-build.yml`（手动触发，命令与 `release.yml` 相同）。
  build:
    name: Build application
    needs: [typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # 这是 CI 里唯一会写 `.turbo` 的 job（`turbo run build`），所以缓存开关保持默认开启：
      # 上游没变的包会直接命中缓存。注意缓存来自本 job 的历史运行，不是同一轮里
      # typecheck / test 的结果——那两个 job 跑的是裸 tsc 与 vitest，不产生 turbo 任务记录。
      - name: Set up environment
        uses: ./.github/actions/setup

      # `pnpm build` 就是 `turbo run build`：按包依赖顺序构建 console / app / cli / www / api。
      - name: Build application
        run: pnpm build

      # 打包冒烟：只解包出应用目录（`--dir`），不生成安装包。
      #
      # 这一步补的是一个结构性缺口：`pnpm build` 产出的只是打包的**输入**，electron-builder
      # 本身在发版之前从不运行，于是「依赖树里某个包对不上」这类问题只在 release.yml 里
      # 才暴露。2026-10 的 1.3.0 就是这样发失败的：`app-builder-lib` 无条件读
      # `@electron/get` 的 `ElectronDownloadCacheMode`（3.1.0 才有），而锁文件钉着 3.0.0，
      # macOS / Windows / Linux 三个 job 全挂在同一行，GitHub Release 直接跳过。
      #
      # 用 `--dir` 而不是完整打包：失败点在「解析产物 → 定位 Electron → 解包」，
      # 这里已经全部覆盖，但不需要 dmg/AppImage 那套工具链。Electron 二进制在安装依赖时
      # 已由 `electron` 自己的 postinstall 下好、落在同一个 @electron/get 缓存目录，
      # 所以这一步通常只要几秒。只在 Linux 上跑：跨平台差异不在这条检查的范围内，
      # 三个平台的真实产物仍由 release.yml 的矩阵负责。
      - name: Smoke-package the app
        run: pnpm --filter osw-app exec electron-builder --config electron-builder.config.cjs --publish never --linux --dir

      - name: Upload build output
        uses: actions/upload-artifact@v6
        with:
          name: osw-build
          # 渲染层与各宿主各自构建到自己的包目录里，仓库根不再有 `dist/`。
          # 这只是打包的**输入**，不是可直接运行的安装包。
          # 控制台产物会出现两次：`packages/console/output/` 是它自己的落点，
          # `apps/cli/output/web/` 是 CLI 构建时拷进去的副本——刻意都留着，
          # 这样下载下来的人不用先去翻构建脚本就知道每个包各自产出了什么。
          path: |
            packages/console/output/
            apps/app/output/
            apps/cli/output/
          if-no-files-found: error
          retention-days: 7
